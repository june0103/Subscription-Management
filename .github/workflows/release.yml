name: Release

# v1.2.0 같은 태그를 푸시하면 프로덕션 트랙으로 출시한다.
# Actions 탭에서 직접 실행하면 트랙을 고를 수 있다(버전 이름은 build.gradle.kts 값).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play 트랙
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키와 Firebase 설정 복원
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD GOOGLE_SERVICES_JSON PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then echo "::error::시크릿 $name 이 없습니다"; exit 1; fi
          done
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
          cat > keystore.properties <<PROPS
          storeFile=release-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: 단위 테스트
        run: ./gradlew testDebugUnitTest

      - name: Play에 업로드
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track || 'production' }}
        run: |
          args=(publishReleaseBundle --track "$TRACK")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args+=("-PVERSION_NAME=${GITHUB_REF_NAME#v}")
          fi
          ./gradlew "${args[@]}"

      - name: AAB와 mapping 보관
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: 서명 파일 정리
        if: always()
        run: rm -f release-keystore.jks keystore.properties app/google-services.json
